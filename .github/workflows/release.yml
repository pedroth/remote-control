name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: remote-control-linux-x64
            archive_name: remote-control-linux-x64.tar.gz
            build_script: build-linux
          - os: macos-latest
            artifact_name: remote-control-macos-x64
            archive_name: remote-control-macos-x64.tar.gz
            build_script: build-macos
          - os: windows-latest
            artifact_name: remote-control-windows-x64
            archive_name: remote-control-windows-x64.zip
            build_script: build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun on Linux and Windows
        if: runner.os != 'macOS'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Bun on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if curl --retry 5 --retry-all-errors --fail --silent --show-error https://bun.sh/install -o bun-install.sh && bash bun-install.sh; then
              installed=true
              break
            fi
            rm -f bun-install.sh
            echo "Bun install attempt ${attempt} failed, retrying..."
          done

          if [ "$installed" != true ]; then
            echo "Failed to install Bun on macOS after 3 attempts" >&2
            exit 1
          fi

          rm -f bun-install.sh
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify Bun installation
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: bun run ${{ matrix.build_script }}

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/remote-control-linux-x64/public
          mv remote-control-server dist/remote-control-linux-x64/remote-control-server
          cp -R public/. dist/remote-control-linux-x64/public/
          tar -czf ${{ matrix.archive_name }} -C dist remote-control-linux-x64

      - name: Package macOS release
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/remote-control-macos-x64/public
          mv remote-control-server dist/remote-control-macos-x64/remote-control-server
          cp -R public/. dist/remote-control-macos-x64/public/
          tar -czf ${{ matrix.archive_name }} -C dist remote-control-macos-x64

      - name: Package Windows release
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path dist/remote-control-windows-x64/public -Force | Out-Null
          Move-Item -Path remote-control-server.exe -Destination dist/remote-control-windows-x64/remote-control-server.exe
          Copy-Item -Path public\* -Destination dist/remote-control-windows-x64/public -Recurse
          Compress-Archive -Path dist/remote-control-windows-x64\* -DestinationPath ${{ matrix.archive_name }}
        shell: pwsh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release metadata
        id: meta
        run: |
          version="$(node -e 'console.log(require("./package.json").version)')"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/remote-control-linux-x64/remote-control-linux-x64.tar.gz
            dist/remote-control-macos-x64/remote-control-macos-x64.tar.gz
            dist/remote-control-windows-x64/remote-control-windows-x64.zip